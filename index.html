<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none, viewport-fit=cover">
    <title>Hello Kitty Run - Mobile Edition</title>
    <style>
        /* Forzar que el cuerpo ocupe toda la pantalla y no tenga barras de scroll */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #fce4ec;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Si el móvil está en vertical, avisamos al usuario de que lo gire */
        @media screen and (orientation: portrait) {
            #orientationWarning {
                display: flex !important;
            }
            #gameWrapper {
                display: none !important;
            }
        }

        #orientationWarning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fce4ec;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d81b60;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #orientationWarning h2 { margin-bottom: 10px; }

        /* Contenedor adaptativo para que en pantallas horizontales use el ratio correcto */
        #gameWrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 450px;
            position: relative;
            box-sizing: border-box;
            padding: 10px;
        }
        
        .score-board {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #d81b60;
            margin-bottom: 5px;
            z-index: 5;
        }

        #menuBtn {
            background-color: #f06292;
            color: white;
            border: 2px solid #d81b60;
            border-radius: 5px;
            padding: 2px 12px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
        }

        #gameCanvas {
            background-color: #ffffff;
            border: 2px solid #f48fb1;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(233, 30, 99, 0.2);
            outline: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-btn {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            background-color: #f06292;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 30;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(252, 228, 236, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 20;
            box-sizing: border-box;
            padding: 20px;
        }

        .overlay-screen h2 {
            color: #d81b60;
            margin: 0 0 15px 0;
            font-size: 22px;
        }

        .overlay-screen input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #f48fb1;
            border-radius: 5px;
            text-align: center;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 15px;
            width: 60%;
            max-width: 250px;
        }

        .btn-visible {
            display: block;
            position: relative;
            transform: none;
            top: auto;
            left: auto;
            margin: 5px;
        }
        
        #leaderboardList {
            font-size: 16px;
            color: #ad1457;
            text-align: left;
            width: 70%;
            max-height: 130px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        #leaderboardList li {
            margin-bottom: 4px;
            border-bottom: 1px dashed #f48fb1;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div id="orientationWarning">
        <h2>🎀 Hello Kitty Run 🎀</h2>
        <p>Por favor, gira tu dispositivo en horizontal para jugar.</p>
        <span style="font-size: 50px;">🔄</span>
    </div>

    <div id="gameWrapper">
        <div class="score-board">
            <div>RÉCORD: <span id="highScore">0</span></div>
            <div><button id="menuBtn">🏠 Menú</button></div>
            <div>PUNTOS: <span id="score">0</span></div>
        </div>

        <div id="gameContainer">
            <canvas id="gameCanvas" width="800" height="300"></canvas>
            
            <div id="startScreen" class="overlay-screen">
                <h2>¡Identifícate para jugar!</h2>
                <input type="text" id="playerName" placeholder="Tu nombre..." maxlength="12">
                <div style="display: flex;">
                    <button id="startBtn" class="game-btn btn-visible">Jugar</button>
                    <button id="showLeaderboardBtn" class="game-btn btn-visible" style="background-color: #ba68c8;">Ver Ranking</button>
                </div>
            </div>

            <div id="leaderboardScreen" class="overlay-screen" style="display: none;">
                <h2>🏆 Top 10 Mundial 🏆</h2>
                <div id="leaderboardList">Cargando datos...</div>
                <button id="closeLeaderboardBtn" class="game-btn btn-visible">Volver</button>
            </div>

            <button id="restartBtn" class="game-btn">Reintentar</button>
            <button id="continueBtn" class="game-btn">Continuar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDQmVNBkmSUvXWjR1nJlJJeibnHpmrd3Q",
            authDomain: "kittyrunner-bac9f.firebaseapp.com",
            projectId: "kittyrunner-bac9f",
            storageBucket: "kittyrunner-bac9f.firebasestorage.app",
            messagingSenderId: "525245357809",
            appId: "1:525245357809:web:19d060e6fd0f4bde21d350"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        
        const restartBtn = document.getElementById('restartBtn');
        const continueBtn = document.getElementById('continueBtn');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const menuBtn = document.getElementById('menuBtn');
        const showLeaderboardBtn = document.getElementById('showLeaderboardBtn');
        const leaderboardScreen = document.getElementById('leaderboardScreen');
        const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
        const playerNameInput = document.getElementById('playerName');
        const leaderboardList = document.getElementById('leaderboardList');

        // Variables de lógica de juego equilibradas para movilidad fluida
        let playerName = "Anónimo";
        let score = 0;
        let highScore = localStorage.getItem('kittyHighScore') || 0;
        highScoreElement.innerText = highScore;
        
        // Físicas ajustadas para velocidad ágil de inicio
        let baseSpeed = 5.5; 
        let gameSpeed = baseSpeed; 
        let scoreSpeed = 0.015; // Velocidad base a la que suben los puntos
        
        let gameOver = false;
        let juegoPausado = true; 
        let milestoneReached = false; 
        const groundHeight = 250;
        let framesSinceLastObstacle = 0;
        let lastLevel = 0;

        async function guardarEnRanking(puntos) {
            try {
                await addDoc(collection(db, "clasificacion"), {
                    nombre: playerName,
                    puntuacion: puntos,
                    fecha: new Date()
                });
            } catch (e) { console.error(e); }
        }

        async function cargarRanking() {
            leaderboardList.innerHTML = "Cargando...";
            try {
                const q = query(collection(db, "clasificacion"), orderBy("puntuacion", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                let html = "<ol>";
                querySnapshot.forEach((doc) => {
                    let datos = doc.data();
                    html += `<li><strong>${datos.nombre}</strong> - ${datos.puntuacion} pts</li>`;
                });
                html += "</ol>";
                if(querySnapshot.empty) html = "Aún no hay puntuaciones.";
                leaderboardList.innerHTML = html;
            } catch (e) { leaderboardList.innerHTML = "Error al cargar la tabla."; }
        }

        const kitty = {
            x: 60,
            y: 205, 
            width: 35,
            height: 45,
            dy: 0,
            gravity: 0.65,       
            jumpPower: -12.5, 
            grounded: true,

            dibujar: function() {
                ctx.font = '45px Arial';
                ctx.fillText('🐱', this.x, this.y + 40);
                ctx.font = '20px Arial';
                ctx.fillText('🎀', this.x + 25, this.y + 15);
            },
            actualizarFisicas: function() {
                this.dy += this.gravity; 
                this.y += this.dy;       

                if (this.y > groundHeight - this.height) {
                    this.y = groundHeight - this.height;
                    this.dy = 0;
                    this.grounded = true;
                }
            }
        };

        const obstacles = [];

        class Obstacle {
            constructor(type) {
                this.type = type; 
                this.x = canvas.width;
                this.width = 30; 
                
                if (this.type === 'tree') {
                    this.height = 40;
                    this.y = groundHeight - this.height;
                    this.emoji = '🌸'; 
                } else {
                    this.height = 30;
                    this.y = groundHeight - 105; 
                    this.emoji = '🍧'; 
                }
            }
            draw() {
                ctx.font = '45px Arial';
                ctx.fillText(this.emoji, this.x, this.y + 35);
            }
            update() {
                this.x -= gameSpeed;
            }
        }

        function handleObstacles() {
            framesSinceLastObstacle++;
            
            // Separación dinámica: a mayor velocidad, requiere mayor separación en píxeles
            let spawnInterval = Math.max(70, 110 - (gameSpeed - baseSpeed) * 8);

            if (framesSinceLastObstacle > spawnInterval && Math.random() < 0.03) {
                let type = Math.random() > 0.4 ? 'tree' : 'icecream';
                obstacles.push(new Obstacle(type));
                framesSinceLastObstacle = 0; 
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.update();
                obs.draw();

                let padding = 8; // Margen de colisión justo
                if (
                    kitty.x + padding < obs.x + obs.width &&
                    kitty.x + kitty.width - padding > obs.x &&
                    kitty.y + padding < obs.y + obs.height &&
                    kitty.y + kitty.height - padding > obs.y
                ) {
                    gameOver = true;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }
        }

        function saltar() {
            if (kitty.grounded && !gameOver && !juegoPausado && startScreen.style.display === 'none' && leaderboardScreen.style.display === 'none') {
                kitty.dy = kitty.jumpPower;
                kitty.grounded = false;
            }
        }

        // Controles unificados e instantáneos
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                if(startScreen.style.display === 'none') e.preventDefault();
                saltar();
            }
        });

        // Eventos de toque de pantalla optimizados para no causar lag táctil
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            saltar();
        }, { passive: false });
        canvas.addEventListener('mousedown', saltar);

        // BUCLE PRINCIPAL DE ANIMACIÓN
        function animar() {
            if (juegoPausado) return;

            if (gameOver) {
                ctx.fillStyle = 'rgba(252, 228, 236, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#d81b60';
                ctx.font = 'bold 40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('¡CHOCASTE!', canvas.width / 2, canvas.height / 2 - 40);
                
                restartBtn.style.display = 'block';
                
                let puntosFinales = Math.floor(score);
                if (puntosFinales > highScore) {
                    highScore = puntosFinales;
                    localStorage.setItem('kittyHighScore', highScore);
                    highScoreElement.innerText = highScore;
                }
                if(puntosFinales > 0) guardarEnRanking(puntosFinales);
                return;
            }

            // SISTEMA DINÁMICO DE DIFICULTAD CADA 100 PUNTOS (Tipo Google Dino)
            let puntosActuales = Math.floor(score);
            let currentLevel = Math.floor(puntosActuales / 100);
            
            if (currentLevel > lastLevel) {
                lastLevel = currentLevel;
                gameSpeed = baseSpeed * Math.pow(1.15, lastLevel); // Sube la velocidad un 15% por nivel
                scoreSpeed = 0.015 * Math.pow(1.15, lastLevel);   // Los puntos suben proporcionalmente más rápido
            }

            // Logro a los 100 puntos exactos en el nivel 1
            if (score >= 100 && !milestoneReached) {
                milestoneReached = true;
                juegoPausado = true;
                score = 100;
                scoreElement.innerText = 100;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#d81b60';
                ctx.textAlign = 'center';
                ctx.font = 'bold 24px Courier New';
                ctx.fillText('¡ENHORABUENA, HAS DESBLOQUEADO UN LOGRO!', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = 'bold 26px Courier New';
                ctx.fillText('🏅 Hello Kitty Atleta 🏅', canvas.width / 2, canvas.height / 2 + 10);
                
                continueBtn.style.display = 'block';
                return; 
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Suelo
            ctx.beginPath();
            ctx.moveTo(0, groundHeight);
            ctx.lineTo(canvas.width, groundHeight);
            ctx.strokeStyle = '#f48fb1';
            ctx.lineWidth = 4;
            ctx.stroke();

            kitty.actualizarFisicas();
            kitty.dibujar();
            handleObstacles();

            score += scoreSpeed; 
            scoreElement.innerText = Math.floor(score);
            
            requestAnimationFrame(animar);
        }

        // --- BOTONES ---
        menuBtn.addEventListener('click', () => {
            juegoPausado = true; 
            restartBtn.style.display = 'none';
            continueBtn.style.display = 'none';
            leaderboardScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        });

        restartBtn.addEventListener('click', () => {
            kitty.y = groundHeight - kitty.height;
            kitty.dy = 0;
            kitty.grounded = true;
            obstacles.length = 0;
            framesSinceLastObstacle = 0;
            score = 0;
            gameSpeed = baseSpeed;
            scoreSpeed = 0.015;
            lastLevel = 0;
            gameOver = false;
            juegoPausado = false;
            milestoneReached = false; 
            restartBtn.style.display = 'none';
            ctx.textAlign = 'left'; 
            requestAnimationFrame(animar);
        });

        continueBtn.addEventListener('click', () => {
            juegoPausado = false;
            continueBtn.style.display = 'none';
            obstacles.length = 0; 
            framesSinceLastObstacle = 0;
            requestAnimationFrame(animar);
        });

        startBtn.addEventListener('click', () => {
            let nombreReg = playerNameInput.value.trim();
            if(nombreReg.length > 0) {
                playerName = nombreReg;
                startScreen.style.display = 'none';
                juegoPausado = false;
                if (gameOver) {
                    restartBtn.click();
                } else {
                    requestAnimationFrame(animar);
                }
            } else { alert("¡Por favor, escribe tu nombre!"); }
        });

        showLeaderboardBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            leaderboardScreen.style.display = 'flex';
            cargarRanking();
        });

        closeLeaderboardBtn.addEventListener('click', () => {
            leaderboardScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        });

        // Renderizado estático inicial de fondo
        ctx.beginPath();
        ctx.moveTo(0, groundHeight);
        ctx.lineTo(canvas.width, groundHeight);
        ctx.strokeStyle = '#f48fb1';
        ctx.lineWidth = 4;
        ctx.stroke();
        kitty.dibujar();
    </script>
</body>
</html>
